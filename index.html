<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SECRET MONEY CLUB</title><link rel="stylesheet" href="style.css?v=51"></head><body><section id="auth" style="max-width:480px;margin:30px auto"><h1>SECRET MONEY CLUB</h1><form id="login"><label>メールアドレス<input name="email" type="email" required></label><label>パスワード<input name="password" type="password" minlength="8" required></label><button>ログイン</button></form><p id="authStatus" role="status"></p></section><main hidden id="workspace"><header><h1>SECRET MONEY CLUB</h1><small>PRIVATE MEMBERS LOUNGE <button id="logout">ログアウト</button></small></header><section class="clubScene" id="clubScene"><div class="clubDoor left"></div><div class="clubDoor right"></div><div class="clubArt"><button type="button" id="portraitTap" aria-label="アリスと会話"><img id="portrait" src="normal.webp" alt="アリス"></button></div><div class="clubCopy"><small>✦ ALICE / PRIVATE CONCIERGE ✦</small><h2 id="clubRank">MEMBER</h2><p id="clubGreeting" aria-live="polite"></p><strong id="clubRoom"></strong><p id="clubNext"></p><progress id="clubProgress" max="100" value="0"></progress><button type="button" id="clubTalk">コンシェルジュと話す</button><p id="affinity"></p><progress id="affinityBar" max="100" value="0"></progress><label><input type="checkbox" id="voice"> 音声を有効にする</label></div></section><section id="wardrobe"><h2>衣装コレクション</h2><div id="outfits"></div><p id="clubStatus" role="status"></p></section><section><label>対象月（25日始まり） <input id="month" type="month"></label><p id="periodLabel"></p><div id="summary" class="stats"></div><div id="quest" class="quest" aria-live="polite"></div></section><nav><button id="dailyTab">📝 日々の記録</button><button id="fixedTab">📊 固定費管理</button><button id="savingTab">💎 貯蓄管理</button></nav><section id="daily"><h2>収支を登録</h2><form id="tx"><input type="hidden" name="id"><label>区分<select name="kind"><option>支出</option><option>収入</option><option>貯蓄・投資</option></select></label><label>日付<input name="date" type="date" required></label><label>金額（円）<input name="amount" type="number" min="1" step="1" required></label><label>カテゴリー<select name="cat"></select></label><label>決済方法<select name="method"></select></label><label>内容・メモ<input name="memo" maxlength="200"></label><button>保存</button><button type="button" id="cancelTx">入力をクリア</button></form><details><summary>カテゴリー・決済方法を追加</summary><form id="master"><select name="type"><option value="expense">支出カテゴリー</option><option value="income">収入カテゴリー</option><option value="saving">貯蓄カテゴリー</option><option value="methods">決済方法</option></select><input name="name" required maxlength="50" placeholder="名称"><button>追加</button></form></details><h2>カテゴリー別支出</h2><div id="cats"></div><h2>決済方法別支出</h2><div id="methods"></div><h2>収支履歴</h2><div id="history"></div></section><section id="fixed" hidden><h2>固定費管理</h2><div id="fixedSummary"></div><div id="fixedList"></div><button id="seedFixed" type="button">基本10項目を追加</button><details id="fixedEditor"><summary>項目を追加・詳細設定</summary><form id="fx"><input type="hidden" name="id"><label>項目名<input name="name" required maxlength="100"></label><label>金額（円）<input name="amount" type="number" min="1" step="1" required></label><label>周期<select name="cycle"><option value="monthly">毎月</option><option value="yearly">毎年</option></select></label><label>年払いの月<input name="annualMonth" type="number" min="1" max="12" value="1" required></label><label>引落日<input name="day" type="number" min="1" max="31" value="27" required></label><label>決済方法<select name="method"></select></label><button>保存</button><button type="button" id="cancelFx">入力をクリア</button></form></details></section><section id="saving" hidden><h2>貯蓄管理</h2><div id="savingStats" class="stats"></div><h2>貯蓄目標</h2><form id="goalForm"><label>月間目標（円）<input name="amount" type="number" min="0" step="1" required></label><button>目標を保存</button></form><p id="goalStatus"></p><progress id="goalProgress" max="100" value="0"></progress><h2>貯蓄の内訳</h2><div id="savingBreakdown"></div><h2>月別貯蓄推移（直近12期間）</h2><div id="savingTrend"></div><button id="addSaving">貯蓄を登録する</button></section><footer>クラウド保存版 <span id="syncStatus" role="status"></span><button id="export">バックアップ（JSON）</button></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=51"></script></body></html>
