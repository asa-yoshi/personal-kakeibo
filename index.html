<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My家計簿</title><link rel="stylesheet" href="style.css"></head><body><section id="auth" style="max-width:480px;margin:30px auto"><h1>My家計簿</h1><form id="login"><label>メールアドレス<input name="email" type="email" required></label><label>パスワード<input name="password" type="password" minlength="8" required></label><button>ログイン</button></form><p id="authStatus" role="status"></p></section><main hidden id="workspace"><header><h1>My家計簿</h1><small>個人用 · クラウド版 <button id="logout">ログアウト</button></small></header><section><label>対象月 <input id="month" type="month"></label><div id="summary" class="stats"></div></section><nav><button id="dailyTab">日々の記録</button><button id="fixedTab">固定費管理</button></nav><section id="daily"><h2>収支を登録</h2><form id="tx"><input type="hidden" name="id"><label>区分<select name="kind"><option>支出</option><option>収入</option></select></label><label>日付<input name="date" type="date" required></label><label>金額（円）<input name="amount" type="number" min="1" step="1" required></label><label>カテゴリー<select name="cat"></select></label><label>決済方法<select name="method"></select></label><label>内容・メモ<input name="memo" maxlength="200"></label><button>保存</button><button type="button" id="cancelTx">入力をクリア</button></form><details><summary>カテゴリー・決済方法を追加</summary><form id="master"><select name="type"><option value="expense">支出カテゴリー</option><option value="income">収入カテゴリー</option><option value="methods">決済方法</option></select><input name="name" required maxlength="50" placeholder="名称"><button>追加</button></form></details><h2>カテゴリー別支出</h2><div id="cats"></div><h2>決済方法別支出</h2><div id="methods"></div><h2>収支履歴</h2><div id="history"></div></section><section id="fixed" hidden><h2>固定費管理</h2><div id="fixedSummary"></div><form id="fx"><input type="hidden" name="id"><label>項目名<input name="name" required maxlength="100"></label><label>金額（円）<input name="amount" type="number" min="1" step="1" required></label><label>周期<select name="cycle"><option value="monthly">毎月</option><option value="yearly">毎年</option></select></label><label>年払いの月<input name="annualMonth" type="number" min="1" max="12" value="1" required></label><label>引落日<input name="day" type="number" min="1" max="31" value="27" required></label><label>決済方法<select name="method"></select></label><button>保存</button><button type="button" id="cancelFx">入力をクリア</button></form><h2>固定費一覧</h2><div id="fixedList"></div></section><footer>クラウド保存版 <span id="syncStatus" role="status"></span><button id="export">バックアップ（JSON）</button></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
