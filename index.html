<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SECRET MONEY CLUB</title><link rel="stylesheet" href="style.css?v=40"></head><body><section id="auth" style="max-width:480px;margin:30px auto"><h1>SECRET MONEY CLUB</h1><form id="login"><label>メールアドレス<input name="email" type="email" required></label><label>パスワード<input name="password" type="password" minlength="8" required></label><button>ログイン</button></form><p id="authStatus" role="status"></p></section><main hidden id="workspace"><header><h1>SECRET MONEY CLUB</h1><small>PRIVATE MEMBERS LOUNGE <button id="logout">ログアウト</button></small></header><section class="clubScene" id="clubScene"><div class="clubDoor left"></div><div class="clubDoor right"></div><div class="clubArt"><svg viewBox="0 0 180 220" role="img" aria-label="黒いイブニングドレスの成人女性コンシェルジュ"><defs><linearGradient id="dress" x2="1" y2="1"><stop stop-color="#67203d"/><stop offset="1" stop-color="#140c20"/></linearGradient></defs><path d="M49 96 Q20 10 90 9 Q153 9 139 110 L120 140 51 132Z" fill="#211322" stroke="#a75d65"/><path d="M70 83 L68 111 45 125 29 208 151 208 135 125 112 111 110 83" fill="#e8b49c"/><path d="M48 121 L90 153 132 121 151 208 29 208Z" fill="url(#dress)" stroke="#d5a45d"/><ellipse cx="90" cy="60" rx="34" ry="43" fill="#f0c4ae"/><path d="M55 54 Q45 5 94 13 Q139 12 126 63 Q100 31 74 33Z" fill="#352031"/><path d="M65 58 Q74 52 82 58 M98 58 Q107 52 115 58" stroke="#382131" stroke-width="3" fill="none"/><path d="M80 79 Q90 85 100 79" stroke="#a73857" stroke-width="3" fill="none"/><circle cx="57" cy="81" r="4" fill="#ffdb82"/><circle cx="123" cy="81" r="4" fill="#ffdb82"/><path d="M70 109 Q90 140 110 109" fill="none" stroke="#eac477" stroke-width="2"/><circle cx="90" cy="130" r="4" fill="#f6d184"/></svg></div><div class="clubCopy"><small>✦ PRIVATE CONCIERGE ✦</small><h2 id="clubRank">MEMBER</h2><p id="clubGreeting" aria-live="polite"></p><strong id="clubRoom"></strong><p id="clubNext"></p><progress id="clubProgress" max="100" value="0"></progress><button type="button" id="clubTalk">コンシェルジュと話す</button></div></section><section><label>対象月（25日始まり） <input id="month" type="month"></label><p id="periodLabel"></p><div id="summary" class="stats"></div><div id="quest" class="quest" aria-live="polite"></div></section><nav><button id="dailyTab">📝 日々の記録</button><button id="fixedTab">📊 固定費管理</button><button id="savingTab">💎 貯蓄管理</button></nav><section id="daily"><h2>収支を登録</h2><form id="tx"><input type="hidden" name="id"><label>区分<select name="kind"><option>支出</option><option>収入</option><option>貯蓄・投資</option></select></label><label>日付<input name="date" type="date" required></label><label>金額（円）<input name="amount" type="number" min="1" step="1" required></label><label>カテゴリー<select name="cat"></select></label><label>決済方法<select name="method"></select></label><label>内容・メモ<input name="memo" maxlength="200"></label><button>保存</button><button type="button" id="cancelTx">入力をクリア</button></form><details><summary>カテゴリー・決済方法を追加</summary><form id="master"><select name="type"><option value="expense">支出カテゴリー</option><option value="income">収入カテゴリー</option><option value="saving">貯蓄カテゴリー</option><option value="methods">決済方法</option></select><input name="name" required maxlength="50" placeholder="名称"><button>追加</button></form></details><h2>カテゴリー別支出</h2><div id="cats"></div><h2>決済方法別支出</h2><div id="methods"></div><h2>収支履歴</h2><div id="history"></div></section><section id="fixed" hidden><h2>固定費管理</h2><div id="fixedSummary"></div><div id="fixedList"></div><button id="seedFixed" type="button">基本10項目を追加</button><details id="fixedEditor"><summary>項目を追加・詳細設定</summary><form id="fx"><input type="hidden" name="id"><label>項目名<input name="name" required maxlength="100"></label><label>金額（円）<input name="amount" type="number" min="1" step="1" required></label><label>周期<select name="cycle"><option value="monthly">毎月</option><option value="yearly">毎年</option></select></label><label>年払いの月<input name="annualMonth" type="number" min="1" max="12" value="1" required></label><label>引落日<input name="day" type="number" min="1" max="31" value="27" required></label><label>決済方法<select name="method"></select></label><button>保存</button><button type="button" id="cancelFx">入力をクリア</button></form></details></section><section id="saving" hidden><h2>貯蓄管理</h2><div id="savingStats" class="stats"></div><h2>貯蓄目標</h2><form id="goalForm"><label>月間目標（円）<input name="amount" type="number" min="0" step="1" required></label><button>目標を保存</button></form><p id="goalStatus"></p><progress id="goalProgress" max="100" value="0"></progress><h2>貯蓄の内訳</h2><div id="savingBreakdown"></div><h2>月別貯蓄推移（直近12期間）</h2><div id="savingTrend"></div><button id="addSaving">貯蓄を登録する</button></section><footer>クラウド保存版 <span id="syncStatus" role="status"></span><button id="export">バックアップ（JSON）</button></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=40"></script></body></html>
